name: Publish to npm

# Publishes a version tag with npm trusted publishing (OIDC): no NPM_TOKEN and no
# 2FA prompt. Configure once on the package page:
#   https://www.npmjs.com/package/@hualiong/dsh-mcp-manager
#   → Settings → Trusted Publisher → GitHub Actions
#     organization/user: hualiong
#     repository:        dsh-mcp-manager
#     workflow filename: publish.yml
#     environment:       (leave empty)
#     allowed actions:   Allow npm publish
# Release:  git tag v0.1.x && git push origin <branch> v0.1.x
# Manual:   Actions → "Publish to npm" → Run workflow (no tag to verify)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      # pnpm 11 requires Node >= 22.13 (Node 20 fails instantly).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Deliberately no registry-url: it writes an empty
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} placeholder into
          # .npmrc, which shadows the OIDC credential this workflow relies on.

      - name: Trusted publishing needs npm >= 11.5.1
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Only meaningful for tag-triggered runs; a manual dispatch has no tag
      # (GITHUB_REF_NAME is the branch), so it is skipped there.
      - name: Verify tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      # Skip publish when this exact version is already on npm (avoids
      # EPUBLISHCONFLICT when re-running the workflow or re-tagging).
      - name: Check if version already published
        id: check-publish
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "Version ${VER} already published — skipping publish"
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check-publish.outputs.skip_publish != 'true'
        run: npm publish --access public --provenance
